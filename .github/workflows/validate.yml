name: データ検証

on:
  push:
    paths: ["data/**", "tools/validate.py", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "tools/validate.py"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/validate.py
